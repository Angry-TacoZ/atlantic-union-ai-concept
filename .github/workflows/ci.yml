name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint, types, unit tests, and build
        run: npm run verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop, mobile, keyboard, and accessibility tests
        run: npm run test:e2e
